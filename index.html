<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSphere - Gaming News</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <div class="nav-container">
        <div class="logo">
            <i class="fas fa-gamepad"></i> GameSphere
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Search games, news...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </div>
</div>

<div class="hero">
    <h1><span>Gaming</span> News Hub</h1>
    <p>Updates · Tournaments · Codes · Reviews · Guides</p>
</div>

<div class="main-container">
    <div class="filters-row">
        <div class="filter-group">
            <h4><i class="fas fa-gamepad"></i> Games</h4>
            <div class="game-buttons" id="gameFilters">
                <button class="game-btn active" data-game="all">All</button>
                <button class="game-btn" data-game="PUBG">PUBG</button>
                <button class="game-btn" data-game="Free Fire">Free Fire</button>
                <button class="game-btn" data-game="VALORANT">VALORANT</button>
                <button class="game-btn" data-game="GTA">GTA</button>
                <button class="game-btn" data-game="COD">COD</button>
                <button class="game-btn" data-game="Minecraft">Minecraft</button>
                <button class="game-btn" data-game="Fortnite">Fortnite</button>
            </div>
        </div>

        <div class="filter-group">
            <h4><i class="fas fa-tags"></i> Categories</h4>
            <div class="cat-buttons" id="categoryFilters">
                <button class="cat-btn active" data-cat="all">All</button>
                <button class="cat-btn" data-cat="update">Updates</button>
                <button class="cat-btn" data-cat="tournament">Tournaments</button>
                <button class="cat-btn" data-cat="code">Codes</button>
                <button class="cat-btn" data-cat="review">Reviews</button>
                <button class="cat-btn" data-cat="guide">Guides</button>
            </div>
        </div>
    </div>

    <div class="results-stats" id="resultsStats"></div>
    <div class="news-grid" id="newsGrid"></div>
</div>

<footer>
    <p>© 2026 GameSphere — All rights reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
